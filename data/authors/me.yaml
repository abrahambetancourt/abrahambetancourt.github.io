bio: |
 I recently finished my appointment as a Postdoctoral Research Scholar in the Richard Andersen laboratory at the California Institute of Technology (Caltech).
 I received my PhD in Biomedical Sciences from the National Autonomous University of Mexico (UNAM).
 
 My research focuses on the neural mechanisms underlying motor and cognitive processes and their application to brain-computer interfaces.
 To investigate these questions, I analyzed large-scale intracortical recordings from Utah arrays implanted in the motor and posterior parietal cortices of individuals with tetraplegia.



